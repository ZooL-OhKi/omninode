name: Omninode CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-omniclient:
    name: Build OmniClient
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build OmniClient
        working-directory: ./omniclient
        run: wails build -platform windows/amd64 -ldflags="-s -w" -o OmniClient.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          files: ./omniclient/build/bin/OmniClient.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}