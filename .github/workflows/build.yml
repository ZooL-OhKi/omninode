name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # === Node1 Gateway (Python/FastAPI) ===
  node1-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./node1-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint with flake8
        working-directory: ./node1-gateway
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        working-directory: ./node1-gateway
        run: pytest || echo "No tests yet"

      - name: Build package
        working-directory: ./node1-gateway
        run: |
          pip install build
          python -m build

  # === OmniClient (Go + Wails) ===
  omniclient:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: ./omniclient
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm install
          fi

      - name: Build
        working-directory: ./omniclient
        run: |
          wails build -platform ${{ matrix.platform == 'windows-latest' && 'windows' || matrix.platform == 'macos-latest' && 'darwin' || 'linux' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniclient-${{ matrix.platform }}
          path: omniclient/build/bin/*

  # === Release (on tag) ===
  release:
    needs: [node1-gateway, omniclient]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
