name: Desktop primitive validation

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m compileall -q desktop
      - name: Test policy and desktop dispatch with fake backend
        working-directory: desktop
        run: python -m unittest -v test_desktop_control
