name: Desktop primitive validation

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image test dependency in disposable runner
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Validate syntax
        run: python -m compileall -q desktop
      - name: Test desktop policy and native protocol with fake backends
        working-directory: desktop
        run: python -m unittest discover -v
  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 playwright
      - name: Install Chromium for isolated fixture
        run: python -m playwright install --with-deps chromium
      - name: Exercise real native messaging with synthetic image host
        working-directory: desktop
        env:
          OMNINODE_BROWSER_INTEGRATION: '1'
        run: python -m unittest -v test_native_browser
