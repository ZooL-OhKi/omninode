name: Extension validation

on:
  push:
    paths:
      - 'omniclient/extension/**'
      - '.github/workflows/extension-validation.yml'
  pull_request:
    paths:
      - 'omniclient/extension/**'
      - '.github/workflows/extension-validation.yml'

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension JavaScript syntax
        run: |
          node --check omniclient/extension/content.js
          node --check omniclient/extension/background.js
          node --check omniclient/extension/options.js
      - name: Run parser and delivery guard tests
        run: node --test omniclient/extension/adapter.test.cjs
