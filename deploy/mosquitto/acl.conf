# OmniNode Pilot ACL Rules - v1 Contract (Identity-based)

user gateway
topic write omninode/v1/nodes/+/tasks
topic write omninode/v1/nodes/+/control
topic read omninode/v1/nodes/+/responses
topic read omninode/v1/nodes/+/heartbeat
topic read omninode/v1/nodes/+/control/ack

user worker-1
topic read omninode/v1/nodes/worker-1/tasks
topic read omninode/v1/nodes/worker-1/control
topic write omninode/v1/nodes/worker-1/responses
topic write omninode/v1/nodes/worker-1/heartbeat
topic write omninode/v1/nodes/worker-1/control/ack

user worker-2
topic read omninode/v1/nodes/worker-2/tasks
topic read omninode/v1/nodes/worker-2/control
topic write omninode/v1/nodes/worker-2/responses
topic write omninode/v1/nodes/worker-2/heartbeat
topic write omninode/v1/nodes/worker-2/control/ack