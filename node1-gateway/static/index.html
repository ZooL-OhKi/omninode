<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omninode Bento Box</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #00ff88; --danger: #ff4444; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        h1, h2 { color: var(--accent); margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border-left: 4px solid #333; }
        .alert-card { border-left-color: #ffaa00; margin-bottom: 15px; }
        .alert-card p { margin: 5px 0; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-approve { background: var(--accent); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
        button:active { opacity: 0.7; }
        .node-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .status-online { color: var(--accent); font-size: 12px; }
    </style>
</head>
<body>
    <h1>Omninode Control</h1>
    <div class="grid">
        <div class="card">
            <h2>Pending Approvals</h2>
            <div id="alerts-container"><p id="no-alerts" style="color:#666;">Nessun task in attesa.</p></div>
        </div>
        <div class="card">
            <h2>Active Fabric Nodes</h2>
            <div id="nodes-container">Caricamento nodi...</div>
        </div>
    </div>
    <script>
        const alertsContainer = document.getElementById('alerts-container');
        const noAlertsMsg = document.getElementById('no-alerts');
        const nodesContainer = document.getElementById('nodes-container');
        const eventSource = new EventSource('/api/v1/stream');
        eventSource.addEventListener('approval_alert', (e) => {
            noAlertsMsg.style.display = 'none';
            const data = JSON.parse(e.data);
            const el = document.createElement('div');
            el.className = 'card alert-card';
            el.id = `task-${data.task_id}`;
            el.innerHTML = `
                <strong style="color:#ffaa00">⚠ ${data.command || 'Approvazione richiesta'}</strong>
                <p>Task: ${data.task_id}</p>
                <p>Agente: ${data.agent_id || 'N/A'}</p>
                <div class="btn-group">
                    <button class="btn-approve" onclick="sendDecision('${data.task_id}', 'approve')">Approva</button>
                    <button class="btn-reject" onclick="sendDecision('${data.task_id}', 'reject')">Rifiuta</button>
                </div>
            `;
            alertsContainer.prepend(el);
        });
        eventSource.addEventListener('node_update', (e) => {
            const activeNodes = JSON.parse(e.data);
            nodesContainer.innerHTML = '';
            if (Object.keys(activeNodes).length === 0) {
                nodesContainer.innerHTML = '<p style="color:#666;">Nessun nodo online.</p>';
                return;
            }
            for (const [nodeId, info] of Object.entries(activeNodes)) {
                nodesContainer.innerHTML += `
                    <div class="node-item">
                        <span>🖥️ ${nodeId} <br><small style="color:#888">${(info.supported_agents || []).join(', ')}</small></span>
                        <span class="status-online">● ONLINE<br><small>${info.timestamp || ''}</small></span>
                    </div>
                `;
            }
        });
        async function sendDecision(taskId, decision) {
            const btnApprove = document.querySelector(`#task-${taskId} .btn-approve`);
            btnApprove.innerText = "Invio...";
            btnApprove.disabled = true;
            try {
                const res = await fetch('/api/v1/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: taskId, decision: decision })
                });
                if (res.ok) {
                    document.getElementById(`task-${taskId}`).remove();
                    if (alertsContainer.children.length <= 1) noAlertsMsg.style.display = 'block';
                } else {
                    alert("Errore nell'invio della decisione");
                    btnApprove.innerText = "Approva";
                    btnApprove.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert("Errore di rete");
            }
        }
    </script>
</body>
</html>
