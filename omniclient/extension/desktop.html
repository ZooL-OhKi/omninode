<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>OmniNode Desktop</title>
<style>body{font:14px system-ui;width:360px;padding:12px;background:#18212f;color:white}button{margin:4px;padding:8px}img{max-width:100%}#status{white-space:pre-wrap}#stop{background:#b91c1c;color:white}</style></head>
<body><h1>OmniNode Desktop</h1><p>Console accessoria. La chat non controlla ancora questo canale.</p>
<button id="open">Abilita sulla scheda selezionata</button><button id="stop">STOP</button>
<button id="capture">Screenshot locale</button>
<p>Apri nella stessa finestra:</p><button data-provider="gemini">Gemini</button><button data-provider="claude">Claude</button><button data-provider="perplexity">Perplexity</button>
<p id="status" role="status">Desktop disattivato</p><img id="preview" alt="Anteprima screenshot locale, non inviata alla chat">
<script src="desktop.js"></script></body></html>
